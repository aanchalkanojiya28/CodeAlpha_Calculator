<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Calculator</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #dbeafe, #e9d5ff);
}

.calculator {
  width: 100%;
  max-width: 360px;
  padding: 24px;
  border-radius: 24px;
  background: #172554;
  box-shadow: 0 18px 40px #64748b66;
}

h1 {
  color: white;
  text-align: center;
  margin-bottom: 20px;
  font-size: 27px;
}

.display {
  min-height: 90px;
  margin-bottom: 18px;
  padding: 15px;
  border-radius: 14px;
  background: #eff6ff;
  text-align: right;
  overflow-wrap: anywhere;
}

#previous {
  min-height: 22px;
  color: #64748b;
  font-size: 14px;
}

#current {
  font-size: 30px;
  color: #172554;
  margin-top: 5px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  min-height: 58px;
  border: none;
  border-radius: 13px;
  background: #dbeafe;
  color: #172554;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #bfdbfe;
  transform: translateY(-2px);
}

.operator {
  background: #a5b4fc;
}

.utility {
  background: #fecaca;
  color: #7f1d1d;
}

.equals {
  background: #38bdf8;
  grid-row: span 2;
}

.zero {
  grid-column: span 2;
}

.footer {
  color: #cbd5e1;
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
}

@media (max-width: 380px) {
  .calculator {
    padding: 16px;
  }

  button {
    min-height: 52px;
  }
}
</style>
</head>

<body>

<div class="calculator">

  <h1>My Calculator</h1>

  <div class="display" aria-live="polite">
    <div id="previous"></div>
    <div id="current">0</div>
  </div>

  <div class="buttons">

    <button class="utility" data-action="clear">C</button>
    <button class="utility" data-action="delete">DEL</button>
    <button class="operator" data-value="%">%</button>
    <button class="operator" data-value="/">÷</button>

    <button data-value="7">7</button>
    <button data-value="8">8</button>
    <button data-value="9">9</button>
    <button class="operator" data-value="*">×</button>

    <button data-value="4">4</button>
    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button class="operator" data-value="-">−</button>

    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button class="operator" data-value="+">+</button>

    <button class="zero" data-value="0">0</button>
    <button data-action="decimal">.</button>
    <button class="equals" data-action="equals">=</button>

  </div>

  <p class="footer">Simple tools. Smart calculations.</p>

</div>

<script>
const currentDisplay = document.getElementById("current");
const previousDisplay = document.getElementById("previous");

let currentValue = "0";
let firstValue = null;
let operator = null;
let resetDisplay = false;

function updateDisplay() {
  currentDisplay.textContent = currentValue;
  previousDisplay.textContent =
    firstValue !== null && operator
      ? firstValue + " " + operator
      : "";
}

function enterNumber(number) {
  if (resetDisplay || currentValue === "Error") {
    currentValue = number;
    resetDisplay = false;
  } else if (currentValue.length < 16) {
    currentValue =
      currentValue === "0" ? number : currentValue + number;
  }

  updateDisplay();
}

function enterDecimal() {
  if (resetDisplay || currentValue === "Error") {
    currentValue = "0";
    resetDisplay = false;
  }

  if (!currentValue.includes(".")) {
    currentValue += ".";
  }

  updateDisplay();
}

function chooseOperator(symbol) {
  if (currentValue === "Error") return;

  if (operator && !resetDisplay) {
    calculate();
  }

  firstValue = parseFloat(currentValue);
  operator = symbol;
  resetDisplay = true;

  updateDisplay();
}

function calculate() {
  if (operator === null || firstValue === null) return;

  const secondValue = parseFloat(currentValue);
  let result;

  switch (operator) {
    case "+":
      result = firstValue + secondValue;
      break;

    case "-":
      result = firstValue - secondValue;
      break;

    case "*":
      result = firstValue * secondValue;
      break;

    case "/":
      if (secondValue === 0) {
        currentValue = "Cannot divide by zero";
        firstValue = null;
        operator = null;
        resetDisplay = true;
        updateDisplay();
        return;
      }
      result = firstValue / secondValue;
      break;

    case "%":
      result = firstValue % secondValue;
      break;
  }

  currentValue = String(
    Number(result.toPrecision(10))
  );

  firstValue = null;
  operator = null;
  resetDisplay = true;

  updateDisplay();
}

function clearCalculator() {
  currentValue = "0";
  firstValue = null;
  operator = null;
  resetDisplay = false;
  updateDisplay();
}

function deleteNumber() {
  if (resetDisplay || currentValue === "Error") {
    currentValue = "0";
    resetDisplay = false;
  } else {
    currentValue = currentValue.length > 1
      ? currentValue.slice(0, -1)
      : "0";
  }

  updateDisplay();
}

document.querySelector(".buttons").addEventListener(
  "click",
  function(event) {
    const button = event.target.closest("button");
    if (!button) return;

    const value = button.dataset.value;
    const action = button.dataset.action;

    if (value !== undefined && /^[0-9]$/.test(value)) {
      enterNumber(value);
    } else if (action === "decimal") {
      enterDecimal();
    } else if (value && ["+", "-", "*", "/", "%"].includes(value)) {
      chooseOperator(value);
    } else if (action === "equals") {
      calculate();
    } else if (action === "clear") {
      clearCalculator();
    } else if (action === "delete") {
      deleteNumber();
    }
  }
);

document.addEventListener("keydown", function(event) {
  if (/^[0-9]$/.test(event.key)) {
    enterNumber(event.key);
  } else if (event.key === ".") {
    enterDecimal();
  } else if (["+", "-", "*", "/", "%"].includes(event.key)) {
    chooseOperator(event.key);
  } else if (event.key === "Enter" || event.key === "=") {
    event.preventDefault();
    calculate();
  } else if (event.key === "Backspace") {
    deleteNumber();
  } else if (event.key === "Escape" || event.key === "Delete") {
    clearCalculator();
  }
});

updateDisplay();
</script>

</body>
</html>
